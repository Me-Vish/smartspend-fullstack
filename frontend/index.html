<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SmartSpend</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <div class="logo">S</div>
      <div>
        <h1>SmartSpend</h1>
        <p class="sub">Finance Tracker + Insights</p>
      </div>
    </div>

    <div class="actions">
      <button class="btn secondary" id="insightsBtn">💡 Insights</button>
      <button class="btn secondary" id="exportBtn">Export JSON</button>
    </div>
  </header>

  <main class="container">

    <!-- Stats -->
    <section class="grid-3">
      <div class="card">
        <h3>Balance</h3>
        <p class="big" id="balanceText">₹0</p>
      </div>

      <div class="card">
        <h3>Total Credit</h3>
        <p class="big credit" id="creditText">₹0</p>
      </div>

      <div class="card">
        <h3>Total Debit</h3>
        <p class="big debit" id="debitText">₹0</p>
      </div>
    </section>

    <!-- Add Transaction -->
    <section class="card section">
      <h2>Add Transaction</h2>

      <form id="txnForm" class="form">
        <div class="row">
          <select id="type" required>
            <option value="credit">Credit</option>
            <option value="debit">Debit</option>
          </select>

          <input id="amount" type="number" min="1" placeholder="Amount (₹)" required />
          <input id="merchant" type="text" placeholder="Merchant / Note" required />
        </div>

        <div class="row">
          <select id="category" required>
            <option value="Food">Food</option>
            <option value="Shopping">Shopping</option>
            <option value="Bills">Bills</option>
            <option value="Travel">Travel</option>
            <option value="Education">Education</option>
            <option value="Health">Health</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Other">Other</option>
          </select>

          <input id="date" type="date" required />

          <select id="mode" required>
            <option value="UPI">UPI</option>
            <option value="Card">Card</option>
            <option value="Wallet">Wallet</option>
            <option value="Cash">Cash</option>
            <option value="NetBanking">NetBanking</option>
          </select>
        </div>

        <button class="btn" type="submit">Add</button>
      </form>
    </section>

    <!-- Filters -->
    <section class="card section">
      <div class="filters">
        <input id="search" placeholder="Search merchant/category..." />
        <select id="filterType">
          <option value="all">All</option>
          <option value="credit">Credit</option>
          <option value="debit">Debit</option>
        </select>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Merchant</th>
              <th>Category</th>
              <th>Type</th>
              <th>Amount</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="txnTable"></tbody>
        </table>
      </div>
    </section>

    <!-- Insights Modal -->
    <section class="card section" id="insightsCard" style="display:none;">
      <h2>Smart Insights</h2>
      <p class="muted" id="insightsText">Loading...</p>
      <button class="btn secondary" id="closeInsights">Close</button>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
